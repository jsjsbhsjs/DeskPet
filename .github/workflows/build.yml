name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            jarsigner -keystore keystore.jks -storepass "${{ secrets.KEYSTORE_PASS }}"               -keypass "${{ secrets.KEY_PASS }}"               app/build/outputs/apk/release/app-release-unsigned.apk               "${{ secrets.KEY_ALIAS }}"
            mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/DeskPet.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-APK
          path: app/build/outputs/apk/release/*.apk
