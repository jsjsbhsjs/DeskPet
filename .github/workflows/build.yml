name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: List Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          ls -la $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools dir"
          echo "SDK root: $ANDROID_SDK_ROOT"

      - name: Build APK
        run: |
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          echo "EXIT_CODE=$?" >> $GITHUB_ENV
        continue-on-error: true

      - name: Show build error
        run: |
          echo "=== Build log tail ==="
          tail -100 build.log
          echo "=== End ==="

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check exit code
        run: |
          if [ "${{ env.EXIT_CODE }}" != "0" ]; then
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-APK
          path: app/build/outputs/apk/release/*.apk
